services:
  - type: web
    name: unloss
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y --no-install-recommends tesseract-ocr && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11