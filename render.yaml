services:
  - type: web
    name: unloss
    runtime: python
    plan: free
    # El sandbox de build de Render free tiene el root en solo lectura (apt-get falla en build).
    # Tesseract se instala en runtime (startCommand), donde el disco efímero sí es escribible.
    buildCommand: pip install -r requirements.txt
    startCommand: apt-get update && apt-get install -y --no-install-recommends tesseract-ocr && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11